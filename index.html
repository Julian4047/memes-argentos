<div className="stk" style=${{transform:'rotate(-1deg)',background:'#f6b40e'}}><${Pix} k="suit" s=${5}/><div className="px">¿DE QUÉ SE ME ACUSA A MÍ?</div></div>

else if(scr==='manual')v=html`<${Title} small/><${Card}><${Typography} variant="h6" sx=${{mb:1}}>Cómo se juega<//><ol style=${{paddingLeft:20,margin:0,lineHeight:1.6}}><li>Elijan cuántos jugadores son, las rondas y los nombres.</li><li>Sale una situación al azar: "Cuando tu mamá te levanta para ir al colegio".</li><li>Por turnos, cada uno elige un video de la <b>lista</b> o pega un <b>link de YouTube</b> con el meme que mejor la representa. Al tocar OK, se pasan el celu.</li><li>Cuando terminan todos, se muestran los videos <b>anónimos</b> en orden al azar.</li><li>Votan en persona y eligen el que más risa da: ese jugador suma 1 punto.</li><li>Gana quien más puntos junte al final.</li><li><b>Recomendación:</b> cuando muestren los memes para votar, transmitan el video de YouTube a una tele (con Chromecast o desde el Smart TV) así lo ven todos.</li></ol><//><${B} color="secondary" onClick=${()=>setScr('setup')}>Empezar<//><${B} variant="outlined" sx=${{bgcolor:'#fff'}} onClick=${()=>setScr('intro')}>Volver<//>`;
